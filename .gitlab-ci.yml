stages:
  - build
  - test
  - sonar
  - deploy-homologacao
  - deploy-producao

cache:
   key: default
   paths:
    - \packages\

build:
  stage: build
  tags:
    - windows
  only:    
    - develop
    - master

  script:
    - .nuget\NuGet.exe restore
    - msbuild  /m /t:Rebuild /nodereuse:false

quality:
  stage: test
  tags:
    - windows
  script: echo 'not implemented'
  
sonar: 
  stage: sonar
  tags:
    - windows
  only:    
    - develop
    - master
    
  script:    
    - run-sonar-no-test.bat  

deploy:
  stage: deploy-homologacao
  tags:
    - windows
  only:    
    - develop
  script:
    - .nuget\NuGet.exe restore
    - msbuild  /m /t:Rebuild /nodereuse:false    
    - msbuild \DashBoardAgil.DashBoardApi\DashBoardAgil.DashBoardApi.csproj /p:DeployOnBuild=true /p:Password=$DEPLOY_PASSWORD /p:PublishProfile=hml /p:VisualStudioVersion=11.0







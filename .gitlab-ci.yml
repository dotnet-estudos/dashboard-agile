stages:
  - build
  - quality
  - sonar
  - sonar-front-end

cache:
   key: default
   paths:
    - \packages

build:
  stage: build
  tags:
    - windows
  only:    
    - projeto/CadastroFornecedores/develop

  script:
    - .nuget\NuGet.exe restore
    - msbuild  /m /t:Rebuild /nodereuse:false

quality:
  stage: quality
  tags:
    - windows
  script: echo 'not implemented'
  
sonar: 
  stage: sonar
  tags:
    - windows
  only:    
    - projeto/CadastroFornecedores/develop    

  script:    
    - run-sonar-no-test.bat   

sonar-front:
  stage: sonar-front-end
  tags:
    - linux
  image: ciricihq/gitlab-sonar-scanner
  only:
    - projeto/CadastroFornecedores/develop
  
  variables:
    SONAR_URL: $SONAR_URL
    SONAR_ANALYSIS_MODE: publish
  script:
  - cd CadastroFornecedorCliente
  - gitlab-sonar-scanner -Dsonar.login=$SONAR_KEY


